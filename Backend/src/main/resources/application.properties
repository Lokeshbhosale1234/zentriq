# Server
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
#
# FIX: prepareThreshold=0
# ────────────────────────
# Render PostgreSQL sits behind PgBouncer in TRANSACTION pooling mode.
# The JDBC driver creates server-side named prepared statements ("S_20" etc.)
# after a query runs a few times. These are stored PER PHYSICAL CONNECTION.
# PgBouncer recycles the same physical connection across different app sessions.
# When a new session gets a recycled connection, "S_20" already exists on it
# → PostgreSQL throws: ERROR: prepared statement "S_20" already exists
# → Spring throws InvalidDataAccessResourceUsageException → 500 / 401
#
# prepareThreshold=0 disables server-side prepared statements entirely.
# The driver sends plain parameterised queries, which are stateless and
# safe to reuse across PgBouncer transaction-pooled connections.
#
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# THE ONE LINE THAT FIXES THE CRASH:
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Hikari connection pool — tuned for Render free tier (97 MB RAM, few connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ── Logging (reduce noise in production) ─────────────────────────────────────
logging.level.com.fintech=INFO
logging.level.org.hibernate.SQL=WARN

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Gemini ────────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}
